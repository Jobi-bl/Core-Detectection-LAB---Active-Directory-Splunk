<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="460" fill="#ffffff"/>

  <line x1="330" y1="96" x2="200" y2="140" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="248" y="118" text-anchor="middle" font-size="12" fill="#993C1D">Password spray</text>

  <line x1="190" y1="196" x2="270" y2="260" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#444">Event logs</text>

  <line x1="490" y1="196" x2="410" y2="260" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="500" y="230" text-anchor="middle" font-size="12" fill="#444">Logs + Sysmon</text>

  <line x1="340" y1="316" x2="340" y2="360" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#444">SPL detection</text>

  <!-- Kali -->
  <rect x="270" y="40" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Kali Linux</text>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#712B13">Attacker</text>

  <!-- Domain Controller -->
  <rect x="85" y="140" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="190" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Windows Server 2022</text>
  <text x="190" y="180" text-anchor="middle" font-size="12" fill="#444441">Domain controller (AD)</text>

  <!-- Windows 10 -->
  <rect x="385" y="140" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="490" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Windows 10</text>
  <text x="490" y="180" text-anchor="middle" font-size="12" fill="#444441">Domain-joined endpoint</text>

  <!-- Splunk -->
  <rect x="180" y="260" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="340" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Splunk Enterprise</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#085041">SIEM on Ubuntu Server</text>

  <!-- Alert + Dashboard -->
  <rect x="210" y="360" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Alert + dashboard</text>
  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#3C3489">Detection &amp; monitoring</text>
</svg>
